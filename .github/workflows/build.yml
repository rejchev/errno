name: Test & Build
on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out
      uses: actions/checkout@v7

    - name: Set up
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Tests
      run: go test -race ./...

    - name: Lint
      run: "go vet ./..."

    - name: Build
      run: go build ./...